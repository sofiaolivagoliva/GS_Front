<!DOCTYPE html>
<html lang=" pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Faça o login do comerciante para cadastrar e gerenciar seus produtos para doação ou desconto.">
    <title>Login do Comerciante | ReTaste </title>

    <!-- Ícone da aba e fontes Google fonts -->
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <!-- Estilos do site -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="script" href="js/script.js">
    <script src="js/script.js" defer></script>
</head>

<body class="body-login">
    <header class="cabecalho">
        <div class="cabecalho-esquerda" aria-label="Navegação principal">
            <img class="logo" src="img/logo.svg" alt="Início">
            <strong>Re<span>Taste</span></strong>
        </div>
    </header>
    <main>
        <article>
            <div class="assets-container">
                <!--ordem dos assetss de planta-->
                <img src="img/prato.svg" alt="">
                <img src="img/plant-escura.svg" alt="">
                <img src="img/plant-medium.svg" alt="">
                <img src="img/planta-media.svg" alt="">
                <img src="img/plant-medium.svg" alt="">
                <img src="img/planta-clarissima.svg" alt="">
                <!--comidas-->
                <img src="img/cenoura.svg" alt="">
                <img src="img/melancia.svg" alt="">
            </div>
        </article>
        <section>
            <div class="login-container">
                <h1 id="titulo-doador" aria-labelledby="titulo-doador">Tornar-se um<br><span class="destaque">doador</span></h1>
                <!-- O coração funcional da página: envia os dados de forma segura (POST) -->
                <!-- Formulário de login do comerciante.
             action é onde as informaçoes vão ser enviadas. method="POST" é a maneira de transportar os dados, ( servidor pega o tipo "name" do campo ).-->
                <div action="#" method="post">
                    <!-- checkbox: bolinha com a função de: seleciona e desseleciona. (manter logado)-->
                </div>
                <!-- Campos de entrada de dados do usuário (obrigatórios para o envio)
                     required: exige o preenchimento antes do envio.
                     autocomplete="postal-code" sujere o CEP ou preenche o camp -->

                <div class="botao-login">
                    <input type="text" name="nome" id="nome" placeholder="Nome do estabelecimento" autocomplete="name"
                        aria-label="Nome do estabelecimento" required>
                </div>

                <div class="botao-login">
                    <input type="text" name="endereco" id="endereco" placeholder="Endereço"
                        autocomplete="street-address" aria-label="Endereço" required>
                </div>

                <div class="botao-login">
                    <input type="text" name="cnpj" id="cnpj" placeholder="CNPJ" autocomplete="off" aria-label="CNPJ"
                        maxlength="18">
                </div>

                <div class="botao-login">
                    <input type="email" name="email" id="email" placeholder="Email" autocomplete="email"
                        aria-label="Email" required>
                </div>
                <div class="botao-login">
                    <input type="password" name="senha" id="senha" placeholder="Senha" autocomplete="current-password"
                        aria-label="Senha" required>
                </div>
                <div class="checkbox-group">
                    <label class="checkbox">
                        <input type="checkbox" name="manter_logado" value="logado" aria-label="Botão de seleção manter logado">
                        <span class="texto">Manter logado</span>

                    </label>
                </div>
                <div class="termos-tenhoConta">
                    <a href="perfil.html" class="texto">Ja tenho uma conta</a>
                </div>

                <div class="entrar-login">
                    <button type="submit" class="texto" aria-label="Continuar">Entrar</button>
                </div>
                <p class="termos" aria-label="ao continuar concorda com os termos">Ao continuar, você concorda com <a href="#">nossos termos</a>.</p>
            </div>

        </section>

        <section>

    </main>
    <!-- RODAPÉ -->
    <footer class="rodape-login" aria-label="menu de navegação">
        <fieldset>
            <legend>Menu</legend>
            <a href="index.html"><img src="img/home.svg" alt="página home" aria-label="link para página home"/></a>
            <a href="index.html">Home</a>
            <br>
            <a href="estabelecimentos.html"><img src="img/estabelecimento.svg" alt="página de ofertas de estabelecimentos" aria-label="link para página de ofertas de estabelecimentos"/></a>
            <a href="estabelecimentos.html">Estabelecimentos</a>
        </fieldset>
    </footer>
</body>

</html>
